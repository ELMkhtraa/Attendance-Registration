<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل وتقارير الحضور والغياب 2026 / 2027</title>
    <!-- خط Cairo الحديث من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
            --report-gradient: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #e0f2fe 0%, #fff3e0 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px;
        }

        .container {
            width: 100%;
            max-width: 600px; /* تحسين العرض ليكون مثالي لمناظير الموبايل والتابلت */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        /* تحسين الشعار للموبايل */
        .logo-container {
            margin-bottom: 12px;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            border: 3px solid #fff;
        }

        header h1 {
            color: #01579b;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        header p {
            color: #e65100;
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 24px;
            background: #fff3e0;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 50px;
            border: 1px solid #ffe0b2;
        }

        /* تنسيق الشبكة للموبايل */
        .stages-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stage-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stage-card:active {
            transform: scale(0.98);
        }

        .stage-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0277bd;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 90px;
            text-align: right;
        }

        .stage-title i {
            font-size: 1.25rem;
            width: 24px;
            text-align: center;
        }

        .stage-buttons {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex: 1;
            max-width: 110px;
        }

        .btn-register {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(2, 136, 209, 0.25);
        }

        .btn-report {
            background: var(--report-gradient);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(46, 125, 50, 0.25);
        }

        /* ألوان أيقونات العناوين */
        .stage-card:nth-child(1) .stage-title i { color: #ff5722; }
        .stage-card:nth-child(2) .stage-title i { color: #ffb300; }
        .stage-card:nth-child(3) .stage-title i { color: #7cb342; }
        .stage-card:nth-child(4) .stage-title i { color: #00acc1; }
        .stage-card:nth-child(5) .stage-title i { color: #3949ab; }
        .stage-card:nth-child(6) .stage-title i { color: #8e24aa; }
        .stage-card:nth-child(7) .stage-title i { color: #d81b60; }
        .stage-card:nth-child(8) .stage-title i { color: #00897b; }

        footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* تحسينات الإبهام واللمس للشاشات الصغيرة جداً */
        @media (max-width: 380px) {
            .stage-card {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                text-align: center;
            }
            .stage-title {
                justify-content: center;
            }
            .btn-action {
                max-width: none;
            }
        }
    </style>
</head>
<body>

        </div>

        <footer>

</body>
